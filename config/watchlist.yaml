# Johnny Terminal - izleme listesi ve parametreler
# Bu dosya kod değil, sadece ayar dosyasıdır. Değerleri istediğiniz gibi
# değiştirebilirsiniz.

# Takip edilen BIST hisseleri (sidebar'daki "sadece watchlist" filtresi için)
watchlist:
  - THYAO
  - SASA
  - EREGL
  - ASELS
  - KCHOL
  - TUPRS
  - FROTO
  - BIMAS
  - SISE
  - PGSUS
  - KRDMD
  - YKBNK

# Johnny Score eşikleri
thresholds:
  al: 85      # bu puan ve üzeri -> AL
  izle: 70    # bu puan ve 'al' eşiği arası -> İZLE, altında -> UZAK DUR

# Günlük trade risk parametreleri
risk:
  stop_max_pct: 2.0      # stop mesafesi en fazla %2
  hedef1_min_pct: 1.5    # hedef 1 en az %1.5
  hedef2_min_pct: 3.0    # hedef 2 en az %3
  giris_bant_pct: 0.3    # alım aralığı genişliği (fiyatın +-%'si)

# v0.3: Johnny Score artık lineer toplam değil. Taban puan (6 alt skorun
# toplamı) bu katsayıyla sıkıştırılır; asıl farklılaştırıcı puan
# scoring/rule_engine.py'deki IF/THEN kural bonuslarından gelir.
# 1.0 = eski (v0.2) tam lineer davranış.
scoring:
  base_damping: 0.6

# Varsayılan veri dosyası (app.py "Örnek veri" seçildiğinde bunu okur)
data:
  default_file: "data/sample_data.csv"

# v0.5: Fintables Pro tarayıcı otomasyonu (integrations/fintables_browser.py)
# Fintables'ın resmi bir API'si yok; bu yüzden Playwright ile kullanıcının
# KENDİ oturumu üzerinden ilgili sayfa açılıp okunuyor. Şifre hiçbir yerde
# saklanmaz; ilk giriş her zaman elle yapılır (bkz. README "Fintables
# Kurulumu").
fintables:
  enabled: true

  # Genel giriş sayfası (herkese açık, doğrulandı: fintables.com/auth/login).
  login_url: "https://fintables.com/auth/login"

  # Hisse Radar sayfası. integrations/explore_fintables_dom.py ile
  # gerçek bir oturumda DOĞRULANDI (2026): sayfa gerçek bir HTML
  # <table class="grid"> kullanıyor. Farklı bir görünüm/filtre
  # kullanmak isterseniz kendi hesabınızda o sayfayı açıp URL'i
  # değiştirebilirsiniz.
  screener_url: "https://fintables.com/radar/hisse-senetleri"

  # Veri çekerken tarayıcı görünsün mü? Sorun gidermek için false yapıp
  # neler olduğunu izleyebilirsiniz; günlük kullanımda true (görünmez)
  # önerilir.
  headless: false

  # Doğrulanmış tablo yapısı: table.grid > thead > tr > th (başlıklar),
  # table.grid > tbody.grid.relative > tr > td (veri satırları).
  # fetch_radar_table() bu seçiciyi kullanır.
  selectors:
    table: "table.grid"
    row: "tr"

  # v1.0 FINAL "final akış": Radar'daki ~640 hisse arasından basit bir ön
  # elemeyle (bkz. scoring/pre_screen.py) ilk top_n aday seçilir; SADECE
  # bunların detay/Teknik Analiz sayfasına girilir (640 hissenin tamamına
  # DEĞİL).
  pre_screen:
    top_n: 20

  # v1.0 FINAL: Ön elemeden geçen adayların detay/işlem ekranı sayfası
  # ayarları. url_template ve legend_item_selector,
  # integrations/explore_fintables_detail_dom.py ile AKBNK üzerinde
  # yapılan gerçek bir DOM taramasıyla DOĞRULANDI (bkz.
  # integrations/fintables_browser.py modül docstring'i).
  detay:
    # {ticker} yerine hisse kodu (örn. SASA) konur. DOĞRULANDI: bu sayfa,
    # RSI/MACD/EMA/ADX/ATR göstergelerini içeren TradingView grafiğini
    # gösteriyor.
    url_template: "https://fintables.com/islem-ekrani?code={ticker}"

    # DOĞRULANDI: grafikteki her gösterge (RSI/MACD/EMA/ADX/ATR/Hacim...)
    # bu seçiciyle bulunan bir "legend" (üst bilgi) metin kutusu olarak
    # durur. Grafiğin/çizgilerin kendisi <canvas>'tır ve okunamaz, ama bu
    # metin kutuları gerçek DOM'dur - integrations/fintables_browser.py
    # bunları ayrıştırıp (bkz. _legend_metnini_ayikla) rsi/macd_signal/
    # ema20/ema50/ema200/adx/atr alanlarına atar.
    legend_item_selector: "[data-name='legend-source-item']"

    # Grafiğin (iframe + legend elementleri) yüklenmesi için azami
    # bekleme (ms).
    grafik_bekleme_ms: 10000

    # ÖNEMLİ: EMA20/EMA50/EMA200'ün üç AYRI gösterge olarak grafiğe
    # EKLENMİŞ olması gerekir (RSI/MACD/ADX/ATR ile birlikte). Johnny
    # bunları otomatik EKLEMEYE ÇALIŞMAZ (bkz. ensure_indicators_visible
    # docstring'i - "gösterge ekle" arama/dialog akışı henüz DOM
    # taramasıyla doğrulanmadı, doğrulanmamış tıklamalar riskli olur).
    # Bunun yerine: Fintables/TradingView hesabınızda RSI, MACD,
    # EMA(20), EMA(50), EMA(200), ADX, ATR göstergelerini BİR KEZ elle
    # ekleyin ve mümkünse "varsayılan şablon" olarak kaydedin - bu genelde
    # hesap/oturum boyunca korunur ve her hissede otomatik görünür.
    # Eksik kalan göstergeler nötr varsayımla hesaplanır, sistem çökmez;
    # sadece o gösterge "Johnny neden bu puanı verdi?" bölümünde
    # "eksik" olarak belirtilir.

    # Her hisse arasında kısa, rastgele bir bekleme (saniye) - "yavaş ve
    # güvenli" çalışma isteği için.
    bekleme_min_sn: 2.0
    bekleme_max_sn: 4.0

    # Radar sayfası açma/element bekleme zaman aşımı (ms)
    timeout_ms: 30000

  note: "Otomasyonu etkinleştirmeden önce Fintables'ın güncel kullanım şartlarını kontrol edin. Johnny yalnızca kullanıcının kendi Pro hesabıyla zaten görebildiği sayfaları, manuel tetikleme ile (arka planda otomatik/periyodik tarama yapmadan) okur. Şimdilik sadece sayfa ilk açıldığında görünen 'Getiri' sekmesi okunur; filtre/sekme değiştirme henüz yapılmıyor."
